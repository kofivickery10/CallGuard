name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify generated blog files are current
        run: |
          npm run blog:build
          git diff --exit-code -- landing/blog landing/sitemap.xml

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test
