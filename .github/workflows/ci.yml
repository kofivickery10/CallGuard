name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Run tests
        run: npm test

      # The landing site has no build step, so nothing else would catch a
      # broken <head> before it reaches production. audit:onpage reads the
      # files directly — no server needed — and exits non-zero only on
      # ERROR-level findings (missing/duplicate title, bad canonical, an
      # orphaned page). Length warnings do not fail the build.
      - name: Audit landing on-page SEO
        run: npm run audit:onpage
